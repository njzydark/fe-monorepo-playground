name: Build & Push App

on:
  workflow_dispatch:
    inputs:
      app_path:
        description: 'App path (e.g., demo/demo-app)'
        required: true
        type: string
      image_name:
        description: 'Image name (e.g., default is repo name)'
        required: false
        type: string
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get image name from package.json
        id: meta
        run: |
          APP_PATH="${{ github.event.inputs.app_path }}"
          APP_NAME=$(cat "$APP_PATH/package.json" | grep '"name"' | head -1 | sed 's/.*"name": *"\([^"]*\)".*/\1/')

          INPUT_IMAGE_NAME="${{ github.event.inputs.image_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          IMAGE_NAME=$(echo "${INPUT_IMAGE_NAME:-$REPO_NAME}" | tr '[:upper:]' '[:lower:]')

          echo "app-path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.app-path }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image-name }}:${{ github.event.inputs.tag }}
          build-args: |
            APP_PATH=${{ steps.meta.outputs.app-path }}
            APP_NAME=${{ steps.meta.outputs.app-name }}
